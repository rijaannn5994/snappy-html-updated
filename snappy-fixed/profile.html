<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snappy — Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let userPosts = [];

async function init() {
  const user = State.currentUser;
  if (!user) {
    renderLayout('profile', `
      <div class="empty-state" style="min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
        <h2 style="font-size:24px;font-weight:800;">Sign in to View Profile</h2>
        <p style="color:#6b7280;max-width:320px;text-align:center;">Access your uploads, manage visibility, and explore your gallery.</p>
        <a href="login.html" class="btn-primary" style="padding:12px 28px;font-size:15px;">Go to Login</a>
      </div>`);
    return;
  }

  const profile = getUserProfile(user);
  renderLayout('profile', `
    <div class="profile-header">
      <div class="profile-avatar" id="avatar-wrap">
        ${avatarHtml(user, 112, profile?.profilePic)}
      </div>
      <div class="profile-info">
        <div class="profile-name">@${user}</div>
        <div class="profile-bio" id="profile-bio">${profile?.bio || ''}</div>
        <div class="profile-actions">
          <span style="font-size:13px;font-weight:600;color:#374151;background:#f3f4f6;padding:5px 12px;border-radius:8px;" id="post-count">— Posts</span>
          <button onclick="openEditModal()" style="display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #e5e7eb;color:#374151;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;">${iconSettings} Edit Profile</button>
          <a href="upload.html" style="display:flex;align-items:center;gap:6px;background:#4f46e5;color:#fff;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;">${iconPlus} New Post</a>
        </div>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h2 style="font-size:20px;font-weight:800;">Your Gallery</h2>
      <div style="display:flex;gap:8px;">
        <button onclick="filterGallery('all')" id="tab-all" class="tab-btn tab-active">All</button>
        <button onclick="filterGallery('public')" id="tab-public" class="tab-btn">Public</button>
        <button onclick="filterGallery('private')" id="tab-private" class="tab-btn">Private</button>
      </div>
    </div>
    <div id="gallery-grid" class="post-grid"><div style="color:#9ca3af;padding:40px 0;">Loading...</div></div>

    <!-- Edit Profile Modal -->
    <div id="edit-modal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)closeEditModal()">
      <div style="background:#fff;border-radius:20px;width:100%;max-width:420px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.2);animation:zoomIn .2s ease;">
        <div style="padding:16px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:16px;font-weight:700;">Edit Profile</span>
          <button onclick="closeEditModal()" style="padding:6px;border-radius:8px;color:#9ca3af;border:none;background:none;cursor:pointer;">${iconX}</button>
        </div>
        <div style="padding:24px;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:20px;">
            <div style="position:relative;cursor:pointer;" onclick="document.getElementById('pic-input').click()">
              <div id="edit-avatar">${avatarHtml(user, 96, profile?.profilePic)}</div>
              <div style="position:absolute;inset:0;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;" id="cam-overlay"
                onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='0'">${iconCamera}</div>
            </div>
            <span onclick="document.getElementById('pic-input').click()" style="font-size:13px;font-weight:700;color:#4f46e5;cursor:pointer;">Change Photo</span>
            <input type="file" id="pic-input" accept="image/*" style="display:none;" onchange="previewPic(event)">
          </div>
          <div class="field"><label>Bio</label><textarea id="bio-input" rows="3" placeholder="Tell us about yourself...">${profile?.bio || ''}</textarea></div>
        </div>
        <div style="padding:14px 20px;border-top:1px solid #f3f4f6;background:#f9fafb;display:flex;justify-content:flex-end;gap:10px;">
          <button onclick="closeEditModal()" style="padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;color:#6b7280;background:#fff;border:1.5px solid #e5e7eb;cursor:pointer;">Cancel</button>
          <button onclick="saveProfile()" style="display:flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;background:#4f46e5;color:#fff;border:none;cursor:pointer;">${iconSave} Save Profile</button>
        </div>
      </div>
    </div>
  `);

  await loadUserPosts();
}

async function loadUserPosts() {
  const user = State.currentUser;
  try {
    const data = await api('GET', '/posts');
    // Show ALL posts (public + private) that belong to this user
    userPosts = (data.data || []).filter(p => p.author === user).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    const countEl = document.getElementById('post-count');
    if (countEl) countEl.textContent = `${userPosts.length} ${userPosts.length === 1 ? 'Post' : 'Posts'}`;
    renderGallery(userPosts);
  } catch(e) {
    const grid = document.getElementById('gallery-grid');
    if (grid) grid.innerHTML = '<div style="color:#9ca3af;padding:20px;">Could not load posts.</div>';
  }
}

let activeFilter = 'all';
function filterGallery(filter) {
  activeFilter = filter;
  ['all','public','private'].forEach(f => {
    const btn = document.getElementById('tab-' + f);
    if (btn) btn.className = 'tab-btn' + (f === filter ? ' tab-active' : '');
  });
  const filtered = filter === 'all' ? userPosts : userPosts.filter(p => p.privacy === filter);
  renderGallery(filtered);
}

function renderGallery(posts) {
  const grid = document.getElementById('gallery-grid');
  if (!grid) return;
  if (!posts || !posts.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>${activeFilter === 'all' ? 'Your gallery is empty right now.' : `No ${activeFilter} posts yet.`}</p><a href="upload.html" class="btn-primary" style="display:inline-block;">Upload your first file</a></div>`;
    return;
  }
  grid.innerHTML = posts.map(p => {
    const isPdf = p.fileType === 'pdf';
    const thumb = isPdf
      ? `<div class="pdf-thumb">${iconFileText}<span>PDF</span></div>`
      : `<img src="${p.fileUrl}" alt="${escHtml(p.title||'')}" loading="lazy" style="width:100%;height:100%;object-fit:cover;transition:transform .4s;" onerror="this.src='https://placehold.co/400x400/f3f4f6/9ca3af?text=Image'">`;
    return `
      <div class="post-card" onclick="openPost('${p.id}')" style="cursor:pointer;">
        <div class="post-thumb" style="aspect-ratio:1/1;position:relative;">
          ${thumb}
          <span class="badge ${p.privacy==='private'?'badge-private':'badge-public'}" style="position:absolute;top:10px;right:10px;backdrop-filter:blur(4px);">
            ${p.privacy==='private'?iconLock:iconGlobe}${p.privacy}
          </span>
        </div>
        <div class="post-body">
          <div class="post-title">${escHtml(p.title||'Untitled')}</div>
          <div class="post-caption">${escHtml(p.caption||'')}</div>
          <div class="stats-row">
            <span class="like-btn ${(p.likes||[]).length?'liked':''}" style="cursor:default;">${iconHeart}<span>${(p.likes||[]).length||''}</span></span>
            <span class="comment-count">${iconComment}<span>${p.comments?.length||''}</span></span>
          </div>
          <div class="post-meta">
            <span style="display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#4f46e5;">★ Your Post</span>
            <span class="post-date">${new Date(p.createdAt).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

function openPost(postId) {
  const post = userPosts.find(p => p.id === postId);
  if (!post) return;
  showPostModal(post, async () => {
    await loadUserPosts();
    // Re-apply current filter
    filterGallery(activeFilter);
  });
}

let newPicDataUrl = null;

function previewPic(e) {
  const file = e.target.files?.[0];
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = ev => {
    newPicDataUrl = ev.target.result;
    document.getElementById('edit-avatar').innerHTML = `<img src="${newPicDataUrl}" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #e0e7ff;">`;
  };
  reader.readAsDataURL(file);
}

function openEditModal() {
  newPicDataUrl = null;
  document.getElementById('edit-modal').style.display = 'flex';
}

function closeEditModal() {
  document.getElementById('edit-modal').style.display = 'none';
}

function saveProfile() {
  const bio = document.getElementById('bio-input').value.trim();
  const updates = { bio };
  if (newPicDataUrl) updates.profilePic = newPicDataUrl;
  updateProfile(updates);
  showToast('Profile updated!');
  closeEditModal();
  setTimeout(() => location.reload(), 500);
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Add tab button styles dynamically
const tabStyle = document.createElement('style');
tabStyle.textContent = `.tab-btn{padding:5px 14px;border-radius:8px;font-size:12px;font-weight:700;border:1.5px solid #e5e7eb;background:#fff;color:#6b7280;cursor:pointer;transition:all .15s;}.tab-btn.tab-active{background:#4f46e5;color:#fff;border-color:#4f46e5;}`;
document.head.appendChild(tabStyle);

init();
</script>
<script src="modal.js"></script>
</body>
</html>
